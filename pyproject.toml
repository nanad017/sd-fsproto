[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdfsproto"
version = "0.1.0"
description = "SD-FSProto: Static-Dynamic Few-Shot Prototypical Learning for PE Malware Family Classification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
extract = ["pefile>=2023.2.7", "lief>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]
